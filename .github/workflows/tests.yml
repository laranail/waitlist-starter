name: Tests

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
  workflow_dispatch:
  # The post-merge check: pull requests are the only other trigger, so drift on main (a kit change included) shows
  # here weekly.
  schedule:
    - cron: '47 6 * * 1'

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

# Composer resolves the laranail packages from their git repositories; authenticated with the job's own read-only
# token, those lookups get the API's authenticated limit instead of the anonymous one.
env:
  COMPOSER_AUTH: '{"github-oauth":{"github.com":"${{ github.token }}"}}'

jobs:
  test:
    if: ${{ !github.event.pull_request.draft }}
    name: Pint, PHPStan and the suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          extensions: dom, curl, libxml, mbstring, zip, pdo, sqlite, pdo_sqlite, bcmath, intl
          coverage: none

      - name: Drop cached laranail archives
        # laranail/* resolves through moving branches and tags, so a restored dist archive may be stale.
        shell: bash
        run: rm -rf "$(composer config cache-files-dir)/laranail"

      - name: Install dependencies
        run: composer update --prefer-dist --no-interaction --no-progress

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress

      - name: Run the suite
        run: vendor/bin/pest --ci
